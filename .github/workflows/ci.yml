name: CI

# 每次提交（push / PR）自动运行测试与依赖 CVE 检查
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Go 测试与漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: 静态检查
        run: go vet ./...

      - name: 运行测试
        run: go test ./...

      - name: 依赖 CVE 扫描（govulncheck）
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  web:
    name: 前端构建与依赖审计
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v7

      - name: 安装 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: 安装 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        working-directory: web
        run: pnpm install --frozen-lockfile

      - name: 依赖 CVE 审计（pnpm audit）
        working-directory: web
        run: pnpm audit

      - name: 构建前端（TailwindCSS）
        working-directory: web
        run: pnpm build
